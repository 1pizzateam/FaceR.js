services:

  facer:
    build:
      context: ./
      dockerfile: dockerfile
    container_name: facer
    volumes:
      - ./:/usr/src/app
      # Linux dependencies live in a Docker volume: the host's node_modules holds native binaries (rollup...) for the host OS
      - facer_deps:/usr/src/app/node_modules
    # reinstall on start so package.json edits reach the node_modules volume
    command: sh -c "npm i --no-progress --loglevel=error --ignore-scripts --no-fund && npm run build"

  website:
    build:
      context: ./website
      dockerfile: dockerfile
    container_name: facer-website
    # the docs import the built library, so wait for facer to produce dist/
    depends_on:
      facer:
        condition: service_completed_successfully
    volumes:
      - ./website/package.json:/usr/src/app/package.json:ro
      - ./website/package-lock.json:/usr/src/app/package-lock.json
      - ./website/docs:/usr/src/app/docs
      - ./dist:/usr/src/app/dist:ro
      - website_deps:/usr/src/app/node_modules
    command: sh -c "npm i --loglevel=error --ignore-scripts --no-fund && node --run dev"
    ports:
      - "5184:5184"

volumes:
  facer_deps:
  website_deps:
